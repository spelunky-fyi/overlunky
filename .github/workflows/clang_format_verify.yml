name: Clang-Format Lint

on:
  push:
    branches: [main]
    paths: &watched_paths
      - "src/**/*.inl"
      - "src/**/*.h"
      - "src/**/*.hpp"
      - "src/**/*.cpp"
      - "!src/game_api/lua_libs/**"
      - ".clang-format"
      - ".github/workflows/clang_format_verifiy.yml" 
  pull_request:
    branches: [main]
    paths: *watched_paths
  workflow_dispatch:
    inputs:
      do_formatting:
        description: "Inplace formatting and commit the result"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: DoozyX/clang-format-lint-action@v0.20
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.do_formatting }}
        with:
          source: "src"
          extensions: "inl,h,hpp,cpp"
          exclude: "./src/game_api/lua_libs"
          clangFormatVersion: 17

      - uses: DoozyX/clang-format-lint-action@v0.20
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.do_formatting }}
        with:
          source: "src"
          extensions: "inl,h,hpp,cpp"
          exclude: "./src/game_api/lua_libs"
          clangFormatVersion: 17
          inplace: true

      - name: Commit and push clang-format changes
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.do_formatting }}
        run: |
          git config --local user.name "Clang-Format Bot"
          git config --local user.email "fake.user@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Automated clang-format changes"
            git push
          else
            echo "No formatting changes to commit."
          fi
